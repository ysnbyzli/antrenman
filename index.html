<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antrenman</title>
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Antrenman">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Geist-style tokens: 100-300 backgrounds, 400-500 borders, 900 secondary text, 1000 primary text */
:root {
  color-scheme: light dark;
  --bg: #fff; --bg2: #fafafa;
  --g100: #f2f2f2; --g200: #e9e9e9; --g400: #e3e3e3; --g500: #cfcfcf;
  --g900: #6f6f6f; --g1000: #171717;
  --green: #138a3e; --green-bg: #ebf8ef; --green-border: #b6e3c4;
  --blue: #0068d6; --blue-bg: #eef5ff;
  --red: #d42a30; --flame: #f0640f;
  --shadow: 0 1px 1px rgba(0,0,0,.03), 0 2px 6px rgba(0,0,0,.04);
  --r: 12px;
  --sans: "Geist", -apple-system, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a; --bg2: #000;
    --g100: #171717; --g200: #202020; --g400: #2a2a2a; --g500: #3d3d3d;
    --g900: #a1a1a1; --g1000: #ededed;
    --green: #4ccf75; --green-bg: #0d2416; --green-border: #1d5a32;
    --blue: #52a8ff; --blue-bg: #0b1d33;
    --red: #ff6166; --flame: #ff8a3d;
    --shadow: 0 1px 1px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
    --bg: #0a0a0a; --bg2: #000;
    --g100: #171717; --g200: #202020; --g400: #2a2a2a; --g500: #3d3d3d;
    --g900: #a1a1a1; --g1000: #ededed;
    --green: #4ccf75; --green-bg: #0d2416; --green-border: #1d5a32;
    --blue: #52a8ff; --blue-bg: #0b1d33;
    --red: #ff6166; --flame: #ff8a3d;
    --shadow: 0 1px 1px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }
html { background: var(--bg2); -webkit-text-size-adjust: 100%; }
body { font: 16px/1.45 var(--sans); color: var(--g1000); background: var(--bg2); -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
input, textarea { user-select: text; -webkit-user-select: text; }
main {
  max-width: 520px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 100px);
}
main.nonav { padding-bottom: 0; }
h1 { font-size: 28px; font-weight: 650; letter-spacing: -.03em; line-height: 1.15; }
h2 { font-size: 13px; font-weight: 550; color: var(--g900); text-transform: uppercase; letter-spacing: .04em; margin: 28px 0 10px; }
h3 { font-size: 22px; font-weight: 620; letter-spacing: -.02em; line-height: 1.2; }
p, .muted { color: var(--g900); }
.small { font-size: 14px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
a { color: inherit; }
.card { background: var(--bg); border: 1px solid var(--g400); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.card + .card { margin-top: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > .card { margin-top: 0; }
button, .btn {
  font: inherit; font-weight: 550; color: var(--g1000); background: var(--bg);
  border: 1px solid var(--g400); border-radius: 10px; min-height: 44px; padding: 0 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  text-decoration: none; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background-color .15s, border-color .15s, transform .1s;
}
button:active, .btn:active { transform: scale(.98); background: var(--g200); }
button:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.primary { background: var(--g1000); color: var(--bg); border-color: var(--g1000); }
.primary:active { background: var(--g900); }
.primary.red { background: var(--red); border-color: var(--red); color: #fff; }
.big { width: 100%; min-height: 56px; font-size: 17px; border-radius: 14px; }
.ghost { background: transparent; border-color: transparent; color: var(--g900); }
.danger { color: var(--red); }
.full { width: 100%; }
.seg { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; padding: 4px; background: var(--g100); border-radius: 12px; }
.seg button { border: 0; background: transparent; min-height: 40px; color: var(--g900); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--g1000); box-shadow: var(--shadow); }
.list { list-style: none; padding: 0; }
.list li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-top: 1px solid var(--g200); }
.list li:first-child { border-top: 0; padding-top: 0; }
.list li:last-child { padding-bottom: 0; }
.list a { text-decoration: none; }
.stat { font-size: 22px; font-weight: 600; }
.badge { font-size: 12px; font-weight: 550; padding: 2px 8px; border-radius: 99px; background: var(--g100); color: var(--g900); white-space: nowrap; }
.badge.ok { background: var(--green-bg); color: var(--green); }
.field, textarea {
  font: 500 17px var(--mono); width: 96px; min-height: 44px; text-align: center; color: var(--g1000);
  background: var(--g100); border: 1px solid var(--g400); border-radius: 10px;
}
textarea { font: 16px/1.4 var(--sans); width: 100%; text-align: left; padding: 10px 12px; resize: vertical; }

/* home: week strip */
.week { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-top: 18px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--g900); }
.day b { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 600 14px var(--sans); border: 1px solid transparent; }
.day.plan b { border-color: var(--g500); color: var(--g1000); }
.day.done b { background: var(--g1000); color: var(--bg); }
.day.home b { background: var(--green-bg); color: var(--green); }
.day.miss b { border: 1px dashed var(--g500); }
.day.today { color: var(--g1000); font-weight: 600; }
.day.today b { box-shadow: 0 0 0 2px var(--bg2), 0 0 0 3.5px var(--g1000); }

/* workout */
.top { display: flex; justify-content: space-between; align-items: center; margin: -8px 0 6px; }
.segs { display: flex; gap: 4px; margin: 2px 0 14px; }
.segs button { flex: 1; min-height: 28px; padding: 0; border: 0; border-radius: 0; background: none; }
.segs button:active { background: none; }
.segs i { display: block; width: 100%; height: 4px; border-radius: 4px; background: var(--g200); }
.segs .p i { background: linear-gradient(90deg, var(--g1000) 50%, var(--g200) 50%); }
.segs .d i { background: var(--g1000); }
.segs .k i { background: repeating-linear-gradient(90deg, var(--g500) 0 4px, transparent 4px 8px); }
.segs .c i { height: 8px; }
.chip {
  margin-top: 10px; min-height: 36px; padding: 0 12px; border-radius: 99px; font-size: 14px;
  background: var(--blue-bg); color: var(--blue); border-color: transparent;
}
.sets { margin-top: 16px; }
.sets > * + * { margin-top: 8px; }
.setrow {
  width: 100%; min-height: 52px; justify-content: space-between; padding: 0 16px; border-radius: var(--r);
  font: 500 17px var(--mono); font-variant-numeric: tabular-nums; color: var(--g900);
}
.setrow.done { background: var(--green-bg); border-color: var(--green-border); color: var(--g1000); }
.setrow .mark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; border: 1.5px solid var(--g500); }
.setrow.done .mark { background: var(--green); border-color: var(--green); color: var(--bg); }
.setcard { background: var(--bg); border: 1px solid var(--g1000); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px 14px; }
.step { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; margin-top: 10px; }
.step button { width: 52px; height: 52px; padding: 0; border-radius: 50%; font-size: 24px; font-weight: 400; background: var(--g100); border-color: transparent; }
.step label { display: flex; flex-direction: column; align-items: center; font-size: 12px; color: var(--g900); }
.step input {
  width: 100%; border: 0; background: transparent; color: var(--g1000); text-align: center; padding: 0;
  font: 600 34px/1.1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; border-radius: 8px;
}
details { margin-top: 20px; }
summary { color: var(--g900); font-size: 14px; font-weight: 550; min-height: 44px; display: flex; align-items: center; cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "›"; margin-left: 6px; transition: transform .15s; }
details[open] summary::after { transform: rotate(90deg); }
.body { flex: 1; padding-bottom: 20px; }
.dock {
  position: sticky; bottom: 0; z-index: 5; margin: 0 -16px;
  padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
  background: color-mix(in srgb, var(--bg2) 85%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--g200); view-transition-name: dock;
}
.dock .ghost { white-space: nowrap; font-size: 15px; padding: 0 8px; }
.rest { color: var(--blue); margin-bottom: 12px; }
.rest b { font: 600 26px/1 var(--mono); font-variant-numeric: tabular-nums; margin-left: 8px; }
.rest button { min-height: 36px; padding: 0 12px; background: transparent; color: var(--blue); border-color: currentColor; font-size: 14px; }
.bar { height: 3px; border-radius: 3px; background: var(--blue-bg); overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; background: var(--blue); transform-origin: left; transition: transform 1s linear; }

/* bottom nav */
nav { /* floating tab bar */
  position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 8px); z-index: 5;
  max-width: 496px; margin: 0 auto; padding: 6px; border-radius: 26px;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6);
  border: 1px solid var(--g400); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.12);
  view-transition-name: nav;
}
nav[hidden] { display: none; }
nav a {
  position: relative; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  text-decoration: none; font-size: 11px; font-weight: 600; color: var(--g900); border-radius: 20px;
  -webkit-tap-highlight-color: transparent; transition: color .2s ease;
}
nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .14s var(--ease-out); }
nav a:active svg { transform: scale(.9); }
nav a[aria-current="page"] { color: var(--g1000); }
nav a[aria-current="page"] svg { stroke-width: 2.2; }
.ind { /* active-tab pill, slides between tabs */
  position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 4); border-radius: 20px;
  background: var(--g100); transition: transform .25s var(--ease-in-out), opacity .2s ease;
}
nav.none .ind { opacity: 0; }

/* motion */
::view-transition { pointer-events: none; }
::view-transition-group(*) { animation-duration: .22s; animation-timing-function: var(--ease-out); }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .12s; animation-timing-function: ease; }
html[data-nav="push"]::view-transition-old(root) { animation: .22s var(--ease-out) both out-l; }
html[data-nav="push"]::view-transition-new(root) { animation: .22s var(--ease-out) both in-r; }
html[data-nav="pop"]::view-transition-old(root) { animation: .22s var(--ease-out) both out-r; }
html[data-nav="pop"]::view-transition-new(root) { animation: .22s var(--ease-out) both in-l; }
@keyframes out-l { to { transform: translateX(-8%); opacity: 0; } }
@keyframes in-r { from { transform: translateX(8%); opacity: 0; } }
@keyframes out-r { to { transform: translateX(8%); opacity: 0; } }
@keyframes in-l { from { transform: translateX(-8%); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }
@keyframes up { from { transform: translateY(10px); opacity: 0; } }
.setrow.new .mark { animation: pop .2s var(--ease-out); }
.setcard.new, .rest.in { animation: up .22s var(--ease-out); }
.cele h1, .cele .grid2 .card { animation: up .3s var(--ease-out) both; }
.cele .grid2 .card:nth-child(1) { animation-delay: .06s; }
.cele .grid2 .card:nth-child(2) { animation-delay: .12s; }
.cele .grid2 .card:nth-child(3) { animation-delay: .18s; }
a.card { transition: transform .14s var(--ease-out), background-color .15s ease; }
a.card:active { transform: scale(.98); background: var(--g100); }
.step button:active { transform: scale(.92); }

/* bottom sheet */
dialog {
  margin: auto auto 0; width: 100%; max-width: 520px; border: 0; border-radius: 20px 20px 0 0;
  padding: 24px 16px calc(env(safe-area-inset-bottom) + 16px);
  background: var(--bg); color: var(--g1000); overscroll-behavior: contain;
  transform: translateY(100%);
  transition: transform .3s var(--ease-drawer), overlay .3s allow-discrete, display .3s allow-discrete;
}
dialog[open] { transform: translateY(0); }
dialog::backdrop { background: rgba(0,0,0,0); transition: background-color .3s ease, overlay .3s allow-discrete, display .3s allow-discrete; }
dialog[open]::backdrop { background: rgba(0,0,0,.45); }
@starting-style { dialog[open] { transform: translateY(100%); } dialog[open]::backdrop { background: rgba(0,0,0,0); } }
dialog p { margin: 6px 0 20px; white-space: pre-line; }

/* modern: streak, hero card, calendar, badges, pictograms */
.card { border-radius: 18px; }
.card .day.today b { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--g1000); }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.lit { color: var(--flame); fill: var(--flame); }
.ic.mid { width: 28px; height: 28px; }
.ic.big { width: 88px; height: 88px; stroke-width: 1.2; color: var(--g500); }
.ic.big.lit { color: var(--flame); }
.streak { display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 14px 0 10px; border-radius: 99px; text-decoration: none;
  background: var(--bg); border: 1px solid var(--g400); box-shadow: var(--shadow); font-weight: 600; font-size: 17px; color: var(--g900);
  transition: transform .14s var(--ease-out); }
.streak:active { transform: scale(.96); }
.streak.lit { color: var(--g1000); }
.goal { display: flex; gap: 4px; margin-top: 14px; }
.goal i { flex: 1; height: 4px; border-radius: 4px; background: var(--g200); }
.goal .on { background: var(--flame); }
.hero { margin-top: 12px; padding: 20px; border-radius: 22px; background: var(--g1000); color: var(--bg); box-shadow: 0 10px 30px rgba(0,0,0,.14); }
.hero p { color: inherit; opacity: .65; }
.hero h3 { font-size: 26px; margin: 2px 0; }
.inv { margin-top: 16px; background: var(--bg); color: var(--g1000); border-color: transparent; }
.inv:active { background: var(--g400); }
.huge { font-size: 88px; font-weight: 650; line-height: .95; letter-spacing: -.05em; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; justify-items: center; margin-top: 10px; }
.cw { font-size: 12px; color: var(--g900); height: 24px; }
.cd { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 500 14px var(--mono); color: var(--g900); text-decoration: none; }
.cd.gym { background: var(--g1000); color: var(--bg); font-weight: 600; }
.cd.hm { background: var(--green-bg); color: var(--green); }
.cd.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--g1000); }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bdg { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; gap: 3px;
  min-height: 0; padding: 10px 2px; border: 0; background: none; border-radius: 16px; color: var(--g900); font-size: 12px; font-weight: 400; }
.bdg:active { background: var(--g100); }
.bdg strong { font-size: 13px; font-weight: 600; margin-top: 6px; color: var(--g900); }
.bdg.got strong { color: var(--g1000); }
.medal { display: block; overflow: visible; }
.medal:not(.off) { filter: drop-shadow(0 4px 8px rgba(0,0,0,.2)); }
.ml { fill: var(--g100); stroke: var(--g400); stroke-width: 2; }
.mt { font-family: var(--sans); font-weight: 700; text-anchor: middle; letter-spacing: -.03em; }
.mini { width: 44px; height: 3px; border-radius: 3px; background: var(--g200); overflow: hidden; margin-top: 2px; }
.mini i { display: block; height: 100%; background: var(--g900); border-radius: 3px; }
.tag { position: absolute; top: 2px; right: 6px; z-index: 1; padding: 1px 7px; border-radius: 99px; background: var(--flame); color: #fff; font-size: 11px; font-weight: 600; }
#dlgX { display: grid; place-items: center; }
#dlgX:not(:empty) { margin: 4px 0 16px; }
#dlgX:not(:empty) ~ h3, #dlgX:not(:empty) ~ p { text-align: center; }
.cele .bdg { animation: pop .3s var(--ease-out) both; animation-delay: .3s; }

/* home: week card + photo hero */
.wkc { display: block; text-decoration: none; }
.wkt { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wkn { font: 650 40px/1 var(--sans); letter-spacing: -.04em; }
.wkn span { font-size: 20px; font-weight: 500; color: var(--g900); letter-spacing: 0; }
.wk { display: flex; gap: 5px; }
.wp { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; color: var(--g900); }
.wp i { width: 27px; height: 46px; border-radius: 14px; background: var(--g100); display: grid; place-items: center; font: 600 12px var(--sans); color: var(--g900); }
.wp.done i { background: var(--g1000); color: var(--bg); }
.wp.home i { background: var(--green-bg); color: var(--green); }
.wp.plan i { background: transparent; border: 1.5px dashed var(--g500); color: var(--g1000); }
.wp.today span { color: var(--g1000); font-weight: 700; }
.wkf { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--g200); font-size: 14px; color: var(--g900); }
.hero { min-height: 300px; display: flex; flex-direction: column; justify-content: space-between; padding: 14px 16px 16px; border-radius: 24px;
  background-color: #151515; background-size: cover; background-position: center; color: #fff; }
.hero p { opacity: .82; }
.hero h3 { font-size: 30px; margin: 2px 0 4px; }
.hl { padding: 5px 11px; border-radius: 99px; background: rgba(255,255,255,.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 13px; font-weight: 550; }
.hseg { display: flex; gap: 2px; padding: 3px; border-radius: 99px; background: rgba(255,255,255,.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.hseg button { min-height: 34px; min-width: 40px; padding: 0 12px; border: 0; border-radius: 99px; background: transparent; color: #fff; font-size: 14px; }
.hseg button[aria-pressed="true"] { background: #fff; color: #111; }
.inv { background: #fff; color: #111; }
.inv:active { background: #dcdcdc; }

/* grouped rows: history + settings */
.group { background: var(--bg); border: 1px solid var(--g400); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.srow { display: flex; align-items: center; justify-content: flex-start; gap: 12px; width: 100%; min-height: 60px; padding: 8px 14px; border: 0; border-radius: 0;
  background: none; text-align: left; font-weight: 400; color: var(--g1000); text-decoration: none; }
.srow + .srow { border-top: 1px solid var(--g200); }
a.srow:active, button.srow:active { background: var(--g100); transform: none; }
.srow.danger { color: var(--red); }
.srow.danger .si { background: color-mix(in srgb, var(--red) 12%, transparent); }

const gymOn = d => S.history.find(h => !h.home && sameDay(h.end, d));
const suggested = (d = new Date()) => gymDay(d) && !gymOn(d) ? nextGym() : 'H';

const fmtTime = t => new Date(t).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
function clock(ms) { const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2,'0')}:${x}` : `${m}:${x}`; }

const unitLabel = u => u === 'sn' ? 'saniye' : u === 'taraf' ? 'tekrar / taraf' : 'tekrar';
const target = t => `${t.max ? `${t.sets}–${t.max}` : t.sets} × ${t.reps}${t.unit === 'sn' ? ' sn' : t.unit === 'taraf' ? ' / taraf' : ''}`;
const setText = (s, u) => hasKg(s) ? `${nf(s.kg)} kg × ${s.reps}` : `${s.reps} ${u === 'sn' ? 'sn' : 'tekrar'}`;
const doneCount = a => a.ex.filter(e => e.sets.some(s => s.done)).length;
const topKg = sets => Math.max(0, ...sets.map(s => parseFloat(s.kg) || 0));
function lastSets(id) { // most recent finished session that has this exercise
  for (const h of S.history) { const e = h.ex.find(e => e.id === id && e.sets.length); if (e) return e.sets; }
  return [];

// Double progression: every set of the last session reached the target reps → suggest the next weight step.

  if (p.length < t.sets || e.sets.some(s => s.done) || !p.every(s => hasKg(s) && s.reps >= t.reps)) return 0;

}

}

let pick = null, sel = null; // home: manually picked plan · workout: set being edited
const curEx = () => S.active.ex[S.active.cur];
const curIdx = e => sel != null && e.sets[sel] ? sel : e.sets.findIndex(s => !s.done);
let fresh = null, wasResting = false; // set just completed / rest bar already on screen: animate each only once
function move(i) { const a = S.active, dir = i > a.cur ? 'push' : 'pop'; a.cur = i; a.hold = null; sel = null; save(); go(dir, () => { render(); scrollTo(0, 0); }); }
function carryKg(e, i) { e.sets.slice(i + 1).forEach(s => { if (!s.done) s.kg = e.sets[i].kg; }); }
function markDone(a, e, s) {

  if (!a.home) { a.restTotal = S.settings.rest * 1000; a.restEnd = Date.now() + a.restTotal; }
  // all sets of this exercise done → move on while resting
  const adv = e.sets.every(s => s.done) && a.cur < a.ex.length - 1;

}
const A = {

  start(k) {
    const p = PLANS[k];
    S.active = {
      id: Date.now().toString(36), plan: k, name: p.name, home: !!p.home, start: Date.now(), cur: 0, restEnd: 0,
      ex: p.items.map(([id, sets, reps, unit = '', max]) => {
        const prev = lastSets(id);
        return { id, name: EX[id].n, target: { sets, reps, unit, max },
          // last time's set count (e.g. 2 sets of an isolation move) carries over, within the plan's range
          sets: Array.from({ length: Math.min(Math.max(sets, prev.length), max || sets) }, (_, i) => {
            const ps = prev[i] || prev[prev.length - 1];

  resume() { location.hash = '#/workout'; },
  async discard() {

  },
  complete() {

  step(arg) {

  next() { const a = S.active; if (a.cur < a.ex.length - 1) move(a.cur + 1); },

}

// Week streak: consecutive weeks (Mon–Sun) that reached the weekly goal. The running week only counts once it's reached.
function streak(H = S.history) {
  const goal = S.settings.goal, cnt = {};
  H.filter(h => !h.home).forEach(h => { const k = monday(h.end).getTime(); cnt[k] = (cnt[k] || 0) + 1; });
  const ok = k => (cnt[k] || 0) >= goal, back = d => { const x = new Date(d); x.setDate(x.getDate() - 7); return x; };
  let w = monday(), cur = 0;
  if (!ok(w.getTime())) w = back(w);
  while (ok(w.getTime())) { cur++; w = back(w); }
  let best = 0, run = 0, last = null;
  Object.keys(cnt).map(Number).sort((a, b) => a - b).forEach(k => {
    if (!ok(k)) { run = 0; last = null; return; }
    run = last != null && Math.round((k - last) / (7 * DAY)) === 1 ? run + 1 : 1; last = k; best = Math.max(best, run);
  });
  return { cur, best, goal, week: cnt[monday().getTime()] || 0 };
}

  ['n10', 'Çift Hane', '10 antrenman tamamla', 'n', 10, 's', '10'], ['n25', 'Müdavim', '25 antrenman tamamla', 'n', 25, 'g', '25'],
  ['n50', 'Yarım Yüz', '50 antrenman tamamla', 'n', 50, 'p', '50'], ['n100', 'Yüzler Kulübü', '100 antrenman tamamla', 'n', 100, 'o', '100'],
  ['s2', 'İki Hafta', '2 hafta üst üste haftalık hedefi tuttur', 's', 2, 'b', '2'], ['s4', 'Bir Ay', '4 hafta üst üste hedefi tuttur', 's', 4, 's', '4'],
  ['s8', 'İki Ay', '8 hafta üst üste hedefi tuttur', 's', 8, 'g', '8'], ['s12', 'Çeyrek Yıl', '12 hafta üst üste hedefi tuttur', 's', 12, 'p', '12'],
  ['s26', 'Yarım Yıl', '26 hafta üst üste hedefi tuttur', 's', 26, 'o', '26'],
  ['p1', 'İlk Rekor', 'Bir harekette ağırlık rekoru kır', 'pr', 1, 'b', '1'], ['p10', 'Rekortmen', '10 ağırlık rekoru kır', 'pr', 10, 's', '10'],
  ['p25', 'Rekor Avcısı', '25 ağırlık rekoru kır', 'pr', 25, 'g', '25'],
  ['t10', '10 Ton', 'Toplam 10.000 kg kaldır', 'vol', 10000, 'b', '10T'], ['t100', '100 Ton', 'Toplam 100.000 kg kaldır', 'vol', 100000, 's', '100T'],
  ['t500', '500 Ton', 'Toplam 500.000 kg kaldır', 'vol', 500000, 'g', '500T'],
  ['h5', 'Ev Disiplini', '5 ev rutini tamamla', 'home', 5, 'b', '5'], ['h25', 'Ev Ustası', '25 ev rutini tamamla', 'home', 25, 's', '25'],
];
const GROUP = { n: ['Antrenman', 'bell'], s: ['Hafta serisi', 'flame'], pr: ['Rekor', 'star'], vol: ['Toplam ağırlık', 'ton'], home: ['Ev rutini', 'home'] };
function badges(H = S.history) {
  const v = { n: H.filter(h => !h.home).length, s: streak(H).best, pr: H.reduce((n, h) => n + (h.prs?.length || 0), 0),
    vol: Math.round(H.reduce((n, h) => n + volume(h), 0)), home: H.filter(h => h.home).length };
  return BADGES.map(([id, name, desc, k, need, tier, label]) => ({ id, name, desc, k, icon: GROUP[k][1], need, tier, label, cur: Math.min(v[k], need), got: v[k] >= need }));
}

// Medals are drawn as SVG: a shape per group, a metal per tier (bronze, silver, gold, blue, onyx).
const TIER = { b: ['#f0c39c', '#b9774a', '#70401f'], s: ['#ffffff', '#b4bac4', '#6d7480'], g: ['#fff0a8', '#eeb02a', '#9a6200'], p: ['#b6f0ff', '#3b9dff', '#173fc4'], o: ['#6b6b6b', '#1f1f1f', '#000000'] };
const TXT = { b: '#fff', s: '#22252b', g: '#4a2e00', p: '#fff', o: '#ff8a3d' };
document.body.insertAdjacentHTML('beforeend', `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${
  Object.entries(TIER).map(([k, [a, b, c]]) => `
    <linearGradient id="m-${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".5" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient>
    <linearGradient id="mi-${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}"/><stop offset=".6" stop-color="${b}"/><stop offset="1" stop-color="${a}"/></linearGradient>`).join('')}
  <linearGradient id="m-sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/></linearGradient></defs></svg>`);
const poly = (n, r, rot = -90, r2 = r) => Array.from({ length: n }, (_, i) => {
  const a = (rot + i * 360 / n) * Math.PI / 180, q = i % 2 ? r2 : r;
  return `${(50 + q * Math.cos(a)).toFixed(1)},${(50 + q * Math.sin(a)).toFixed(1)}`;
}).join(' ');
const SHAPES = {
  n: a => `<polygon points="${poly(6, 47)}" stroke-linejoin="round" ${a}/>`,
  s: a => `<path d="M50 4 90 17v31c0 24-17 39-40 48C27 87 10 72 10 48V17z" stroke-linejoin="round" ${a}/>`,
  pr: a => `<polygon points="${poly(20, 48, -90, 41)}" stroke-linejoin="round" ${a}/>`,
  vol: a => `<polygon points="${poly(8, 48, -67.5)}" stroke-linejoin="round" ${a}/>`,
  home: a => `<circle cx="50" cy="50" r="46" ${a}/>`,
};
function medal(b, size = 68) {
  const at = (s, a) => `<g transform="translate(50 50) scale(${s}) translate(-50 -50)">${SHAPES[b.k](a)}</g>`;
  const fs = b.label.length > 3 ? 19 : b.label.length > 2 ? 23 : 30, col = b.got ? TXT[b.tier] : 'var(--g500)', up = b.k === 's' ? 5 : 0;
  return `<svg class="medal ${b.got ? '' : 'off'}" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">${
    b.got ? at(1, `fill="url(#m-${b.tier})"`) + at(.82, `fill="url(#mi-${b.tier})" stroke="rgba(255,255,255,.45)" stroke-width="1.5"`) + at(.82, 'fill="url(#m-sheen)"')
          : at(1, 'class="ml"')}
    <text x="50" y="${54 - up}" font-size="${fs}" fill="${col}" class="mt">${b.label}</text>
    <g transform="translate(40.4 ${59 - up}) scale(.8)" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[b.icon]}</g></svg>`;
}
const fresh1 = id => S.history[0]?.badges?.includes(id); // earned in the latest workout
const badgeHtml = b => `<button class="bdg ${b.got ? 'got' : ''}" data-act="badge" data-arg="${b.id}" aria-label="${b.name}: ${b.got ? 'kazanıldı' : `${b.cur} / ${b.need}`}">
  ${fresh1(b.id) ? '<span class="tag">Yeni</span>' : ''}${medal(b)}<strong>${b.name}</strong>
  ${b.got ? '' : `<span class="num">${b.cur.toLocaleString('tr-TR')} / ${b.need.toLocaleString('tr-TR')}</span><span class="mini"><i style="width:${b.cur / b.need * 100}%"></i></span>`}</button>`;

let calM = 0, celebrate = false; // calendar: months back from now · confetti: once, right after finishing
function calendar() {
  const f = new Date(); f.setHours(0, 0, 0, 0); f.setDate(1); f.setMonth(f.getMonth() - calM);
  const n = new Date(f.getFullYear(), f.getMonth() + 1, 0).getDate(), lead = (f.getDay() + 6) % 7;
  const cell = i => {
    const d = new Date(f); d.setDate(i);
    const g = gymOn(d), hm = !g && S.history.some(h => h.home && sameDay(h.end, d)), td = sameDay(d, Date.now()) ? 'today' : '';
    return g ? `<a class="cd gym ${td}" href="#/history/${g.id}" aria-label="${i}: ${esc(g.name)}">${i}</a>`
             : `<span class="cd ${hm ? 'hm' : ''} ${td}"${hm ? ` aria-label="${i}: ev rutini"` : ''}>${i}</span>`;
  };
  return `<div class="card">
    <div class="row between"><button class="ghost x" data-act="cal" data-arg="1" aria-label="Önceki ay">‹</button>
      <strong>${esc(f.toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' }))}</strong>
      <button class="ghost x" data-act="cal" data-arg="-1" aria-label="Sonraki ay" ${calM ? '' : 'disabled style="visibility:hidden"'}>›</button></div>
    <div class="cal">${['P', 'S', 'Ç', 'P', 'C', 'C', 'P'].map(x => `<span class="cw">${x}</span>`).join('')}${'<span></span>'.repeat(lead)}${Array.from({ length: n }, (_, i) => cell(i + 1)).join('')}</div>
    <p class="small" style="text-align:center;margin-top:12px"><span class="dot" style="background:var(--g1000);border-radius:50%"></span>Salon<span class="dot" style="background:var(--green);border-radius:50%;margin-left:16px"></span>Ev rutini</p>
  </div>`;
}
function confetti() {
  if (calm.matches) return '';
  const c = ['var(--flame)', 'var(--green)', 'var(--blue)', 'var(--g1000)'];
  return `<div class="confetti" aria-hidden="true">${Array.from({ length: 30 }, (_, i) =>
    `<i style="left:${(i * 37) % 100}%;background:${c[i % 4]};animation-delay:${(i % 7) * 70}ms;animation-duration:${1500 + (i % 5) * 200}ms"></i>`).join('')}</div>`;
}

function weeksChart() { // gym workouts per week, last 8 weeks
  const goal = S.settings.goal, w = Array.from({ length: 8 }, (_, i) => {
    const d = monday(); d.setDate(d.getDate() - 7 * (7 - i));
    return [d, S.history.filter(h => !h.home && monday(h.end).getTime() === d.getTime()).length];
  }), mx = Math.max(goal, ...w.map(x => x[1]));
  return `<div class="card"><div class="bars" role="img" aria-label="Son 8 haftanın antrenman sayıları: ${w.map(x => x[1]).join(', ')}">${w.map(([d, n]) =>
    `<div><span class="num">${n || ''}</span><i class="${n >= goal ? 'on' : ''}" style="height:${Math.max(4, n / mx * 72)}px"></i><span class="num">${d.getDate()}.${d.getMonth() + 1}</span></div>`).join('')}</div>
    <p class="small" style="text-align:center;margin-top:10px"><span class="dot" style="background:var(--flame)"></span>Hedefe ulaşılan hafta</p></div>`;
}

    <div class="badges" style="margin-top:8px">${g.map(badgeHtml).join('')}</div></div>`; }).join('')}`;
}

function home() {
  const a = S.active, last = S.history.find(h => !h.home), st = streak(), left = Math.max(0, st.goal - st.week);
  const k = pick || suggested(), p = PLANS[k], doneToday = gymOn(new Date()), lastSame = S.history.find(h => h.plan === k);
  const stale = !S.settings.lastBackup || Date.now() - S.settings.lastBackup > 14 * DAY;
  const hr = new Date().getHours(), hello = hr < 5 ? 'İyi geceler' : hr < 12 ? 'Günaydın' : hr < 18 ? 'İyi günler' : 'İyi akşamlar';
  const needInstall = /iphone|ipad|ipod/i.test(navigator.userAgent) && !navigator.standalone && !S.settings.hideInstall;
  const body = ['kg', 'waist'].map(f => { const x = S.body.find(b => b[f] != null); return x ? `${nf(x[f])} ${f === 'kg' ? 'kg' : 'cm'}` : ''; }).filter(Boolean);
  const ids = a ? a.ex.map(e => e.id) : p.items.map(i => i[0]), cover = ids.find(id => PICS.has(id));
  const line = a ? `${doneCount(a)}/${a.ex.length} hareket · ${fmtTime(a.start)}’de başladı`
    : `${p.items.length} hareket${lastSame ? ` · geçen sefer ${mins(lastSame.end - lastSame.start)}` : ''}`;
  const over = a ? '' : doneToday && !pick ? `Bugün ${esc(doneToday.name)} tamamlandı ✓` : k === 'H' ? `Sıradaki salon günü: Full Body ${nextGym()}` : '';
  return `
  <div class="row between">
    <div><p class="small">${esc(fmtDate(Date.now()))}</p><h1 style="margin-top:2px">${hello}</h1></div>
    <a class="streak ${st.cur ? 'lit' : ''}" href="#/streak" aria-label="Seri: ${st.cur} hafta. Seri ve rozetleri aç">${ic('flame', st.cur ? 'lit' : '')}<span class="num">${st.cur}</span></a>
  </div>
  ${needInstall ? `<div class="card" style="margin-top:16px"><div class="row between"><strong>Ana ekrana ekle</strong><button class="ghost x" data-act="hideInstall" aria-label="Kapat">×</button></div>
    <p class="small">Safari’de Paylaş düğmesine dokunup “Ana Ekrana Ekle”yi seç. Uygulama tam ekran açılır ve kayıtların silinme riski kalkar.</p></div>` : ''}
  <a class="card wkc" href="#/streak" style="margin-top:${needInstall ? 10 : 16}px">
    <div class="wkt"><div><div class="wkn num">${st.week}<span>/${st.goal}</span></div><p class="small">Bu hafta</p></div>${weekPills()}</div>
    <div class="wkf">${ic('flame', st.week >= st.goal ? 'lit' : '')}<span style="flex:1">${st.week >= st.goal ? `Haftalık hedef tamam · ${st.cur} hafta seri`
      : `${st.cur ? 'Seriyi korumak' : 'Seriyi başlatmak'} için ${left} antrenman daha`}</span><span aria-hidden="true">›</span></div>
  </a>
  <div class="hero" style="background-image:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.12) 42%,rgba(0,0,0,.9))${cover ? `,url(img/${cover}-1.jpg)` : ''}">
    <div class="row between">
      <span class="hl">${a ? 'Devam ediyor' : k === suggested() ? 'Bugün için önerilen' : 'Elle seçildi'}</span>
      ${a ? '' : `<div class="hseg" role="group" aria-label="Antrenman seç">${['A', 'B', 'H'].map(x =>
        `<button data-act="pick" data-arg="${x}" aria-pressed="${x === k}" aria-label="${esc(PLANS[x].name)}">${x === 'H' ? 'Ev' : x}</button>`).join('')}</div>`}
    </div>
    <div>
      ${over ? `<p class="small">${over}</p>` : ''}
      <h3>${esc(a ? a.name : p.name)}</h3>
      <p class="small">${line}</p>
      ${a ? `<button class="big inv" data-act="resume">Antrenmana Devam Et</button>
             <button class="ghost full" style="color:#fff;opacity:.75;margin-top:4px" data-act="discard">Antrenmanı Sil…</button>`
          : `<button class="big inv" data-act="start" data-arg="${k}">Antrenmana Başla</button>`}
    </div>
  </div>
  ${a ? '' : `
    <h2>Hareketler</h2>
    <div class="card">
      <ul class="list">${p.items.map(([id, sets, reps, unit = '', max]) => { const kg = p.home ? 0 : topKg(lastSets(id)); return `
        <li style="align-items:center"><a class="row" href="#/ex/${id}" style="gap:12px;flex:1;min-width:0">${thumb(id, 44)}<span>${esc(EX[id].n)}</span></a>
        <span class="muted num small" style="white-space:nowrap;text-align:right">${target({ sets, reps, unit, max })}${kg ? `<br>${nf(kg)} kg` : ''}</span></li>`; }).join('')}
      </ul>
    </div>`}
  <div class="grid2" style="margin-top:12px">
    <a class="card" href="#/history" style="text-decoration:none"><p class="small">Son antrenman</p>
      ${last ? `<div class="stat" style="font-size:17px">${esc(fmtDate(last.end, { day: 'numeric', month: 'short' }))}</div><p class="small">${esc(last.name)} · ${mins(last.end - last.start)}</p>`
             : `<div class="stat" style="font-size:17px">—</div><p class="small">Henüz yok</p>`}</a>
    <a class="card" href="#/body" style="text-decoration:none"><p class="small">Ölçüler</p>
      ${body.length ? `<div class="stat num" style="font-size:17px">${body[0]}</div><p class="small num">${body[1] || 'Bel ölçüsü yok'}</p>`
                    : `<div class="stat" style="font-size:17px">—</div><p class="small">Kilo ve bel ekle</p>`}</a>
  </div>
  ${stale && S.history.length ? `<div class="card row between" style="margin-top:10px"><p class="small">2 haftadır yedek alınmadı.</p><button data-act="exportData">Yedekle</button></div>` : ''}`;
}

function workout() {
  const a = S.active, e = a.ex[a.cur], t = e.target, isLast = a.cur === a.ex.length - 1, nx = a.ex[a.cur + 1];
  const ci = curIdx(e), s = e.sets[ci], allDone = e.sets.every(s => s.done);
  const prev = lastSets(e.id), ps = prev[ci] || prev[prev.length - 1], up = a.home ? 0 : bump(e), note = S.notes[e.id];
  const resting = a.restEnd > Date.now(), u = unitLabel(t.unit), restIn = resting && !wasResting, total = a.restTotal || S.settings.rest * 1000;
  wasResting = resting;
  const primary = a.hold ? ['complete', `Durdur · <span class="num" id="hold">${clock(a.hold.end - Date.now())}</span>`]
    : s && !s.done ? ['complete', t.unit === 'sn' ? `${s.reps} sn Başlat` : `${ci + 1}. Seti Tamamla`]
    : s ? ['doneEdit', 'Tamam']
    : isLast ? ['finish', 'Antrenmanı Bitir'] : ['next', 'Sonraki Hareket'];
  const stepper = (f, label, mode) => `
    <div class="step">
      <button data-act="step" data-arg="${f}:-1" aria-label="${label} azalt">−</button>
      <label><input inputmode="${mode}" enterkeyhint="done" data-f="${f}" value="${esc(nf(s[f]))}" placeholder="–" aria-label="${label}"><span>${f === 'kg' ? 'kg' : u}</span></label>
      <button data-act="step" data-arg="${f}:1" aria-label="${label} artır">+</button>
    </div>`;
  // time between two finished sets, like a lap time
  const gap = i => { const d = i && e.sets[i].done && e.sets[i - 1].done ? e.sets[i].done - e.sets[i - 1].done : 0; return d > 0 ? `<div class="gap num">${clock(d)} sonra</div>` : ''; };
  return `
  <div class="body">
  <div class="top">
    <a class="btn round" href="#/" aria-label="Ana sayfaya dön, antrenman sürer">‹</a>
    <div style="text-align:center"><div class="small muted">${esc(a.name)} · ${a.cur + 1}/${a.ex.length}</div><div class="timer" id="elapsed">${clock(Date.now() - a.start)}</div></div>
    <button class="pillbtn" data-act="finish">Bitir</button>
  </div>
  <div class="strip">${a.ex.map((x, i) => { const d = x.sets.filter(s => s.done).length, all = d && d === x.sets.length;
    return `<button class="st ${x.skipped ? 'k' : all ? 'd' : ''} ${i === a.cur ? 'c' : ''}" data-act="go" data-arg="${i}" ${all ? 'data-n="✓"' : d ? `data-n="${d}/${x.sets.length}"` : ''}
      ${i === a.cur ? 'aria-current="step"' : ''} aria-label="${i + 1}. ${esc(x.name)}: ${x.skipped ? 'atlandı' : `${d}/${x.sets.length} set`}">${thumb(x.id, 48)}</button>`; }).join('')}
  </div>
  <div class="row between" style="align-items:flex-start">
    <div>
      <h3><a href="#/ex/${e.id}" style="text-decoration:none">${esc(e.name)} <span class="muted" aria-hidden="true">›</span></a></h3>
      <p class="small" style="margin-top:2px">Hedef <span class="num">${target(t)}</span>${note ? ` · ${esc(note)}` : ''}</p>
    </div>
    ${e.skipped ? '<span class="badge">Atlandı</span>' : allDone ? '<span class="badge ok">✓ Tamam</span>' : ''}
  </div>
  ${up ? `<button class="chip" data-act="bump">Geçen sefer hedef tamam · ${nf(up)} kg dene</button>` : ''}
  <div class="sets">${e.sets.map((x, i) => gap(i) + (i === ci ? `
    <div class="setcard ${fresh ? 'new' : ''}">
      <div class="row between"><strong>Set ${i + 1}</strong>
        ${x.done ? '<button class="ghost" style="min-height:32px;padding:0" data-act="undo">Tamamlanmadı yap</button>'
                 : ps ? `<span class="small muted">Önceki <span class="num">${esc(setText(ps, t.unit))}</span></span>` : ''}</div>
      ${a.home ? '' : stepper('kg', 'Ağırlık', 'decimal')}
      ${stepper('reps', t.unit === 'sn' ? 'Süre' : 'Tekrar', 'numeric')}
    </div>` : `
    <button class="setrow ${a.home ? 'one' : ''} ${x.done ? 'done' : ''} ${x === fresh ? 'new' : ''}" data-act="sel" data-arg="${i}" aria-label="Set ${i + 1}: ${esc(setText(x, t.unit))}, ${x.done ? 'tamamlandı' : 'bekliyor'}. Düzenle">
      <span class="sn">${i + 1}</span>
      ${a.home ? '' : `<span class="pill">${hasKg(x) ? nf(x.kg) : '–'}<small>kg</small></span>`}
      <span class="pill">${x.reps}<small>${t.unit === 'sn' ? 'sn' : 'tekrar'}</small></span>
      <span class="mark" aria-hidden="true">${x.done ? '✓' : ''}</span>
    </button>`)).join('')}
  </div>
  <div class="row" style="margin-top:6px">
    <button class="ghost" style="padding-left:0" data-act="addSet">+ Set ekle</button>
    ${s && !s.done && e.sets.length > 1 ? `<button class="ghost" data-act="delSet">Set ${ci + 1}’i sil</button>` : ''}
  </div>
  ${nx ? `<button class="card nextup" data-act="next">${thumb(nx.id, 44)}
    <span style="flex:1"><span class="small muted" style="display:block">Sıradaki</span><strong>${esc(nx.name)}</strong></span>
    <span class="muted num small">${target(nx.target)}</span><span class="muted" aria-hidden="true">›</span></button>` : ''}

        <circle class="rv" id="restbar" cx="18" cy="18" r="15.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - (a.restEnd - Date.now()) / total * 100}" transform="rotate(-90 18 18)"/></svg>

let histF = 'all'; // history filter: all | gym | home
const dur = ms => { const m = Math.round(ms / 6e4); return m >= 60 ? `${Math.floor(m / 60)} sa ${m % 60} dk` : `${m} dk`; };
const kgs = v => v >= 1000 ? `${nf((v / 1000).toFixed(1))} ton` : `${Math.round(v)} kg`;
function historyList() {
  const all = S.history;
  if (!all.length) return `<h1>Geçmiş</h1><div class="card" style="margin-top:16px"><p>Henüz tamamlanan antrenman yok. İlk antrenmanını bitirdiğinde burada görünecek.</p></div>`;
  const mk = t => { const d = new Date(t); return d.getFullYear() * 12 + d.getMonth(); };
  const H = all.filter(h => histF === 'all' || (histF === 'home') === !!h.home), month = all.filter(h => !h.home && mk(h.end) === mk(Date.now()));
  const groups = [];
  H.forEach(h => { const k = mk(h.end); if (groups.at(-1)?.k !== k) groups.push({ k, t: h.end, items: [] }); groups.at(-1).items.push(h); });
  const row = h => { const d = new Date(h.end), sets = h.ex.reduce((n, e) => n + e.sets.length, 0), v = volume(h); return `
    <a class="srow" href="#/history/${h.id}">
      <span class="dt ${h.home ? 'hm' : ''}"><b class="num">${d.getDate()}</b><span>${esc(d.toLocaleDateString('tr-TR', { weekday: 'short' }))}</span></span>
      <div class="sl"><strong>${esc(h.name)}</strong><p class="small" style="font-variant-numeric:tabular-nums;white-space:nowrap">${mins(h.end - h.start)}${sets ? ` · ${sets} set` : ''}${v ? ` · ${kgs(v)}` : ''}</p></div>
      ${h.prs?.length ? `<span class="badge ok">${h.prs.length} rekor</span>` : ''}<span class="muted" aria-hidden="true">›</span>
    </a>`; };
  return `
  <div class="row between"><h1>Geçmiş</h1><a class="btn" href="#/streak" style="border-radius:99px;min-height:40px;padding:0 14px">${ic('cal')}Takvim</a></div>
  <div class="grid2" style="margin-top:16px;grid-template-columns:repeat(3,1fr)">
    <div class="card"><p class="small">Bu ay</p><div class="stat num">${month.length}</div><p class="small">antrenman</p></div>
    <div class="card"><p class="small">Süre</p><div class="stat num" style="font-size:20px;white-space:nowrap;line-height:1.55">${(m => m >= 60 ? `${nf((m / 60).toFixed(1))}<span class="small muted"> sa</span>` : `${m}<span class="small muted"> dk</span>`)(Math.round(month.reduce((n, h) => n + h.end - h.start, 0) / 6e4))}</div><p class="small">bu ay</p></div>
    <div class="card"><p class="small">Kaldırılan</p><div class="stat num" style="font-size:20px;white-space:nowrap;line-height:1.55">${(v => v >= 1000 ? `${nf((v / 1000).toFixed(1))}<span class="small muted"> ton</span>` : `${Math.round(v)}<span class="small muted"> kg</span>`)(month.reduce((n, h) => n + volume(h), 0))}</div><p class="small">bu ay</p></div>
  </div>
  <div class="chips" role="group" aria-label="Filtre">${[['all', 'Tümü'], ['gym', 'Salon'], ['home', 'Ev']].map(([k, n]) =>
    `<button data-act="histF" data-arg="${k}" aria-pressed="${histF === k}">${n}</button>`).join('')}</div>
  ${groups.length ? groups.map(g => `
    <h2 class="row between"><span>${esc(new Date(g.t).toLocaleDateString('tr-TR', { month: 'long', year: 'numeric' }))}</span>
      <span class="num" style="text-transform:none;letter-spacing:0;font-weight:400">${g.items.length} antrenman · ${dur(g.items.reduce((n, h) => n + h.end - h.start, 0))}</span></h2>
    <div class="group">${g.items.map(row).join('')}</div>`).join('') : `<p class="small" style="margin-top:20px">Bu filtrede kayıt yok.</p>`}`;
}

function historyDetail(id, summary) {
  const h = S.history.find(h => h.id === id);
  if (!h) return `<h1>Bulunamadı</h1><p style="margin-top:8px"><a href="#/history">Geçmişe dön</a></p>`;
  const sets = h.ex.reduce((n, e) => n + e.sets.length, 0);
  const vol = h.ex.reduce((n, e) => n + e.sets.reduce((m, s) => m + (parseFloat(s.kg) || 0) * (parseFloat(s.reps) || 0), 0), 0);
  return `
  <div class="body ${summary ? 'cele' : ''}">

  <h1 style="margin-top:${summary ? 24 : 4}px">${summary ? 'Antrenman tamam ✓' : esc(h.name)}</h1>
  <p class="small" style="margin-top:4px">${summary ? esc(h.name) + ' · ' : ''}${esc(fmtDate(h.end))} · ${fmtTime(h.start)}–${fmtTime(h.end)}</p>
  ${summary && !h.home ? (() => { const st = streak(), n = S.history.filter(x => !x.home).length; return `
  <a class="card row" href="#/streak" style="margin-top:14px;gap:12px;text-decoration:none">${ic('flame', 'mid ' + (st.week >= st.goal ? 'lit' : ''))}
    <div style="flex:1"><strong>${st.week >= st.goal ? `Haftalık hedef tamam · ${st.cur} hafta seri` : `Bu hafta ${st.week}/${st.goal}`}</strong>
    <p class="small">${n}. antrenmanın${st.week < st.goal ? ` · seri için ${st.goal - st.week} antrenman daha` : ''}</p></div><span class="muted" aria-hidden="true">›</span></a>`; })() : ''}
  ${h.badges?.length ? `<p class="small" style="margin:14px 0 8px">Yeni rozet kazandın</p><div class="badges">${badges().filter(b => h.badges.includes(b.id)).map(badgeHtml).join('')}</div>` : ''}
  <div class="grid2" style="margin-top:16px;grid-template-columns:repeat(3,1fr)">
    <div class="card"><p class="small">Süre</p><div class="stat num">${Math.max(1, Math.round((h.end - h.start) / 60000))}<span class="small muted"> dk</span></div></div>
    <div class="card"><p class="small">Set</p><div class="stat num">${sets}</div></div>
    <div class="card"><p class="small">Hareket</p><div class="stat num">${h.ex.filter(e => e.sets.length).length}<span class="small muted">/${h.ex.length}</span></div></div>
  </div>
  ${vol ? `<p class="small" style="margin-top:10px">Toplam kaldırılan: <span class="num">${Math.round(vol).toLocaleString('tr-TR')} kg</span></p>` : ''}
  <h2>Hareketler</h2>
  <div class="card"><ul class="list">${h.ex.map(e => `
    <li><span><a href="#/ex/${e.id}">${esc(e.name)}</a>${h.prs?.includes(e.id) ? ' <span class="badge ok">Rekor</span>' : ''}</span>
    <span class="num small ${e.sets.length ? '' : 'muted'}" style="text-align:right;white-space:nowrap">${e.sets.length ? e.sets.map(s => esc(setText(s, e.target.unit))).join('<br>') : 'Yapılmadı'}</span></li>`).join('')}
  </ul></div>
  ${summary ? '' : `<button class="ghost danger full" style="margin-top:20px" data-act="delHistory" data-arg="${h.id}">Bu Kaydı Sil…</button>`}
  </div>
  ${summary ? `<div class="dock"><a class="btn primary big" href="#/">Tamam</a></div>` : ''}`;
}

function muscleMap(id) {

  const fig = (data, h, label) => `<svg viewBox="0 0 1000 ${h}" width="${Math.round(220000 / h)}" height="220" role="img" aria-label="${label}">${
    Object.entries(data).map(([m, polys]) => polys.map(pts => `<polygon points="${pts}" class="${p.includes(m) ? 'p' : s.includes(m) ? 's' : ''}"/>`).join('')).join('')}</svg>`;
  return `<div class="card"><div class="muscles">${fig(FRONT, 2000, 'Vücut önden')}${fig(BACK, 2200, 'Vücut arkadan')}</div>
    <p class="small" style="text-align:center;margin-top:10px"><span class="dot"></span>Ana kas<span class="dot" style="opacity:.35;margin-left:16px"></span>Yardımcı kas</p></div>`;
}

function body() {
  const b = S.body, today = b.find(x => sameDay(x.t, Date.now())) || {}, iso = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const card = (k, label, unit) => {
    const v = b.filter(x => x[k] != null).map(x => x[k]).reverse(), d = v.length > 1 ? Math.round((v.at(-1) - v[0]) * 10) / 10 : null;
    return `<div class="card"><p class="small">${label}</p>
      <div class="stat num">${v.length ? nf(v.at(-1)) : '—'}<span class="small muted"> ${unit}</span></div>

  return `

      <button class="ghost x" data-act="delBody" data-arg="${x.t}" aria-label="Bu ölçüyü sil">×</button></span></li>`).join('')}
  </ul></div>` : `<p class="small">Henüz ölçü yok. İlk ölçünü yukarıdan ekle.</p>`}`;
}

function spark(v, unit = 'kg', label = 'Ağırlık') {
  const w = 300, h = 56, p = 6, mn = Math.min(...v), r = Math.max(...v) - mn || 1;
  const pts = v.map((x, i) => [p + i * (w - 2 * p) / (v.length - 1), h - p - (x - mn) / r * (h - 2 * p)].map(n => n.toFixed(1)));
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label} gelişimi: ${nf(v[0])} ${unit} → ${nf(v.at(-1))} ${unit}" style="width:100%;height:56px;display:block">
    <polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.join(' ')}"/>
    <circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="3.5" fill="currentColor"/></svg>`;
}

function exercise(id) {

  return `

  <h2>Gelişim</h2>

  ${all.length ? `<div class="card"><ul class="list">${all.slice(0, 12).map(l => `
    <li><span>${esc(fmtDate(l.t, { day: 'numeric', month: 'short' }))}</span><span class="num small" style="text-align:right">${l.sets.map(s => esc(setText(s, l.u))).join(', ')}</span></li>`).join('')}
  </ul></div>` : `<p class="small">Bu hareket için henüz kayıt yok.</p>`}`;
}

      `<button style="min-height:34px;padding:0 10px;font-size:14px" data-act="theme" data-arg="${k}" aria-pressed="${st.theme === k}">${name}</button>`).join('')}</div></div></div>

function library() {

  <div class="group" style="margin-top:16px">${Object.entries(EX).map(([id, x]) => `
    <a class="srow" href="#/ex/${id}">${thumb(id, 44)}<div class="sl"><strong>${esc(x.n)}</strong><p class="small">${esc(x.m)}</p></div><span class="muted" aria-hidden="true">›</span></a>`).join('')}
  </div>`;

// ---------- Router ----------
function render() {
  const [, page = '', arg] = location.hash.split('/');
  let html, nav = page;
  if (page === 'workout' && S.active) html = workout();
  else if (page === 'history' && arg) { html = historyDetail(arg); nav = 'history'; }
  else if (page === 'summary') html = historyDetail(arg, true);
  else if (page === 'history') html = historyList();
  else if (page === 'ex') { html = exercise(arg); nav = '-'; }
  else if (page === 'body') html = body();
  else if (page === 'streak') { html = streakPage(); nav = '-'; }
  else if (page === 'settings') html = settings();
  else if (page === 'exercises') { html = library(); nav = 'settings'; }
  else { html = home(); nav = ''; }
  const bare = (page === 'workout' && S.active) || page === 'summary';
  $('#app').innerHTML = html;
  $('#app').classList.toggle('nonav', bare);
  $('#nav').hidden = bare;
  document.querySelectorAll('nav a').forEach(l => { if (l.getAttribute('href') === '#/' + nav) l.setAttribute('aria-current', 'page'); else l.removeAttribute('aria-current'); });
  const tab = ['', 'history', 'body', 'settings'].indexOf(nav);
  $('#nav').classList.toggle('none', tab < 0);
  if (tab >= 0) $('.ind').style.transform = `translateX(${tab * 100}%)`;
  fresh = null; celebrate = false;
  const cs = $('.st.c'); if (cs) cs.parentNode.scrollLeft = cs.offsetLeft - cs.parentNode.clientWidth / 2 + 24; // keep the current exercise in view
  awake();
}

let pressing = false; // a button press is in flight: don't replace the DOM under the finger
document.addEventListener('pointerdown', ev => {
  if (!ev.target.closest('[data-act]')) return;
  pressing = true; setTimeout(() => pressing = false, 600);
  if (document.activeElement?.dataset?.f) document.activeElement.blur(); // commit a value being typed first
}, true);
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  pressing = false; if (S.active) unlock();
  A[b.dataset.act](b.dataset.arg);
});
document.addEventListener('change', ev => {
  const t = ev.target, num = () => parseFloat(t.value.trim().replace(',', '.'));
  if (t.id === 'sound') { S.settings.sound = t.checked; return save(); }
  if (t.id === 'note') { const v = t.value.trim(); if (v) S.notes[t.dataset.id] = v; else delete S.notes[t.dataset.id]; return save(); }
  if (!t.dataset.f || !S.active) return;
  const e = curEx(), i = curIdx(e), f = t.dataset.f, v = num();
  e.sets[i][f] = Number.isFinite(v) && v >= 0 ? v : (f === 'kg' ? '' : e.target.reps);
  if (f === 'kg' && e.sets[i].kg !== '') carryKg(e, i);
  save();
  if (!pressing) render();
});
document.addEventListener('focusin', ev => { if (ev.target.dataset?.f) ev.target.select(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') ev.target.blur(); });

// Timers are computed from timestamps, so they stay correct after the screen was locked.
function tick() {
  const a = S.active; if (!a) return;
  const el = $('#elapsed'); if (el) el.textContent = clock(Date.now() - a.start);
  const typing = !!document.activeElement?.dataset?.f, onPage = location.hash === '#/workout';
  if (a.hold) {
    const left = a.hold.end - Date.now(), e = curEx(), s = e.sets[a.hold.i];
    if (left <= 0) { a.hold = null; beep(); if (s && !s.done) markDone(a, e, s); else { save(); render(); } }
    else if ($('#hold')) $('#hold').textContent = clock(left);
  }
  if (a.restEnd) {
    const left = a.restEnd - Date.now();
    if (left <= 0) { a.restEnd = 0; save(); beep(); if (onPage && !typing) render(); }
    else if ($('#rest')) { $('#rest').textContent = clock(left); $('#restbar').style.strokeDashoffset = 100 - left / (a.restTotal || S.settings.rest * 1000) * 100; }
  }
}
// Swipe left/right on the workout screen to change exercise
let tx = null;
addEventListener('touchstart', ev => { const p = ev.touches[0]; tx = ev.target.closest('input, .step, dialog, .dock, .strip') ? null : [p.clientX, p.clientY, Date.now()]; }, { passive: true });
addEventListener('touchend', ev => {
  if (!tx || !S.active || location.hash !== '#/workout') return;
  const p = ev.changedTouches[0], dx = p.clientX - tx[0], dy = p.clientY - tx[1];
  if (Math.abs(dx) > 70 && Math.abs(dy) < 40 && Date.now() - tx[2] < 600) dx < 0 ? A.next() : A.prev();
  tx = null;
}, { passive: true });
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.activeElement?.dataset?.f) { tick(); render(); } });
addEventListener('hashchange', ev => {
  const d = depth(location.hash) - depth(new URL(ev.oldURL).hash);
  go(d > 0 ? 'push' : d < 0 ? 'pop' : 'tab', () => { sel = null; render(); scrollTo(0, 0); });
});
render();

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');

// Self-check: open index.html?test and look at the console.
if (location.search === '?test') {
  const keep = S;
  S = norm({ history: [] });
  console.assert(nextGym() === 'A', 'first workout is A');
  S.history = [{ plan: 'H', home: true, end: 1, ex: [] }, { plan: 'A', end: 0, ex: [{ id: 'x', sets: [{ kg: 40, reps: 12 }, { kg: 40, reps: 12 }] }] }];
  console.assert(nextGym() === 'B', 'B follows A, home routine ignored');
  const e = { id: 'x', target: { sets: 2, reps: 12 }, sets: [{ kg: 40, reps: 12 }, { kg: 40, reps: 12 }] };
  console.assert(bump(e) === 42.5, 'all sets hit target → +step');
  S.history[1].ex[0].sets[1].reps = 11;
  console.assert(bump(e) === 0, 'one set short → no bump');
  console.assert(clock(90000) === '1:30' && clock(3723000) === '1:02:03', 'clock');
  const wk = n => { const d = monday(); d.setDate(d.getDate() - 7 * n); d.setHours(12); return d.getTime(); };
  S.history = [0, 0, 0, 1, 1, 1, 3, 3, 3].map(n => ({ plan: 'A', end: wk(n), ex: [] }));
  const st = streak(); console.assert(st.cur === 2 && st.best === 2 && st.week === 3, 'streak: two full weeks, gap before', st);
  S.history = S.history.slice(1); console.assert(streak().cur === 1, 'running week below goal: streak carries from last week');
  S = keep; console.log('self-check done');
}
